<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Anagrama</title>
<meta name="description" content="Ordená las letras y encontrá la palabra. Niveles, tiempo, premios y logros.">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="claro">
<div id="app">
  <section id="menu" class="screen">
    <div class="topbar"><span class="coins">🪙 <b id="mCoins">0</b></span><span class="rank">Juegos mentales</span><span></span></div>
    <h1 class="mt">Elegí un juego</h1>
    <button class="gcard g1" data-game="ana"><span class="ico">🔤</span><span><b>Anagrama</b><small>Ordená las letras y armá la palabra</small></span><em id="mLvAna"></em></button>
    <button class="gcard g2" data-game="hid"><span class="ico">🔍</span><span><b>Palabras escondidas</b><small>Hay letras de más: encontrá la palabra</small></span><em id="mLvHid"></em></button>
    <button class="gcard g3" data-game="adi"><span class="ico">🕵️</span><span><b>Adivina</b><small>100 categorías · 10 pistas: ¡cuantas menos uses, más puntos!</small></span><em id="mLvAdi"></em></button>
  </section>

  <section id="adHome" class="screen" hidden>
    <div class="topbar"><button class="ib" id="adBack" aria-label="Menú de juegos">‹</button><span class="coins">🪙 <b id="adCoins">0</b></span><span class="rank">Adivina</span></div>
    <div class="levelcard" id="adLvl"></div>
    <p class="tag">Descubrí la palabra oculta con la menor cantidad de pistas</p>
    <input class="search" id="adSearch" placeholder="🔎 Buscar entre las 100 categorías" autocomplete="off">
    <div class="cats" id="adCats"></div>
  </section>

  <section id="adGame" class="screen" hidden>
    <div class="topbar"><button class="ib" id="adQuit" aria-label="Salir">✕</button><span class="rank" id="adCatName"></span><span class="coins">🪙 <b id="adTotal">0</b></span></div>
    <div class="dots" id="adDots"></div>
    <div class="goal" id="adGoal"></div>
    <div class="worth" id="adWorth"></div>
    <ol class="clues" id="adClues"></ol>
    <div class="guess"><input id="adIn" placeholder="Escribí tu respuesta" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"><button class="big" id="adGo">Adivinar</button></div>
    <div class="tools two"><button id="adMore">💡<small>Otra pista</small></button><button id="adSkip">⏭<small>Pasar · 0 pts</small></button></div>
    <div class="float" id="adFloat" aria-live="polite"></div>
  </section>

  <section id="home" class="screen" hidden>
    <div class="topbar"><button class="ib" id="btnMenu" aria-label="Menú de juegos">‹</button><span class="coins">🪙 <b id="hCoins">0</b></span><span class="rank" id="hRank"></span><button class="ib" id="btnSound" aria-label="Sonido">🔊</button></div>
    <div class="logo" id="hLogo" aria-hidden="true"></div>
    <p class="tag" id="hTag"></p>
    <div class="levelcard" id="hCard"></div>
    <button class="big" id="btnPlay">▶ Jugar</button>
    <button class="chest" id="btnDaily"></button>
    <button class="duel live" id="btnLive">⚡ <b>Duelo en vivo</b><small>Los dos juegan a la vez y ven el avance del otro</small></button>
    <button class="duel" id="btnDuel">📨 <b>Desafío por link</b><small>Tu amigo juega después, con las mismas palabras</small></button>
    <div class="row3"><button id="btnAch">🏅 Logros</button><button id="btnShop">🛍 Tienda</button><button id="btnStats">📊 Estadísticas</button></div>
    <button class="link" id="btnInstall" hidden>⬇ Instalar en el celular</button>
  </section>

  <section id="game" class="screen" hidden>
    <div class="topbar"><button class="ib" id="btnHome" aria-label="Salir">✕</button><span class="lives" id="gLives"></span><span class="coins">🪙 <b id="gCoins">0</b></span><button class="ib" id="btnPause" aria-label="Pausa">⏸</button></div>
    <div class="dots" id="gDots"></div>
    <div class="rival" id="gRival" hidden></div>
    <div class="timer"><i id="gBar"></i><b id="gTime"></b></div>
    <div class="streak" id="gStreak"></div>
    <div class="cat">Pista: <b id="gCat"></b> · <span id="gLen"></span></div>
    <div class="clue" id="gClue" hidden></div>
    <div class="slots" id="gSlots" aria-label="Tu respuesta"></div>
    <div class="pool" id="gPool" aria-label="Letras"></div>
    <div class="tools">
      <button id="tShuffle">🔀<small>Mezclar</small></button>
      <button id="tHint">💡<small>Pista · 10🪙</small></button>
      <button id="tTime">⏱<small>+15 s · 15🪙</small></button>
      <button id="tSkip">⏭<small>Pasar · −❤</small></button>
    </div>
    <div class="float" id="gFloat" aria-live="polite"></div>
  </section>
</div>
<div id="modal" class="modal" hidden><div class="box" id="box"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="words.js"></script>
<script src="clues.js"></script>
<script src="adivina.js"></script>
<script src="adivina-1.js"></script>
<script src="adivina-2.js"></script>
<script src="adivina-3.js"></script>
<script src="adivina-4.js"></script>
<script src="adivina-5.js"></script>
<script src="scenes.js"></script>
<script src="game.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
